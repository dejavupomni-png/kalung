<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Shop - Online Store</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: rgba(22, 30, 49, 0.9);
            --accent-gold: #f59e0b;
            --accent-gold-bright: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        /* NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; background: #111827; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.5em; font-weight: bold; color: var(--accent-gold-bright); }
        .nav-actions { display: flex; gap: 15px; align-items: center; }

        .btn {
            padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: bold; transition: 0.3s; text-decoration: none; display: inline-block;
        }
        .btn-gold { background: var(--accent-gold); color: #000; }
        .btn-gold:hover { background: var(--accent-gold-bright); }
        .btn-outline { background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold-bright); }

        .cart-icon { position: relative; cursor: pointer; font-size: 1.2em; padding: 5px 10px; }
        .cart-badge {
            position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff;
            font-size: 0.75em; padding: 2px 6px; border-radius: 50%; font-weight: bold;
        }

        /* CONTAINER PRODUK */
        .container { padding: 40px 5%; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px;
        }
        .product-card {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); overflow: hidden; cursor: pointer; transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent-gold); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-title { font-size: 1.1em; margin-bottom: 8px; font-weight: 600; }
        .product-price { color: var(--accent-gold-bright); font-weight: bold; font-size: 1.2em; }

        /* MODAL COMMON */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg); padding: 25px; border-radius: var(--radius-md);
            width: 90%; max-width: 500px; border: 1px solid var(--accent-gold);
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 1.5em; cursor: pointer; }

        /* DETAIL PRODUK MODAL */
        .detail-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }

        .comments-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; text-align: left; }
        .comment-item { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85em; }

        /* CART MODAL */
        .cart-item { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-align: left;}
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">👑 KING SHOP</div>
        <div class="nav-actions">
            <div class="cart-icon" onclick="openCart()">
                🛒 Keranjang <span class="cart-badge" id="cart-count">0</span>
            </div>
            <!-- Tombol Login Admin di Pojok Kanan Atas -->
            <a href="admin.html" class="btn btn-outline">🔑 Login Admin</a>
        </div>
    </nav>

    <!-- KATALOG BARANG -->
    <div class="container">
        <h2 style="margin-bottom: 20px;">Katalog Produk</h2>
        <div class="product-grid" id="product-list">
            <!-- Data Produk dari JS -->
        </div>
    </div>

    <!-- MODAL DETAIL PRODUK -->
    <div id="modal-detail" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('modal-detail')">&times;</button>
            <img id="d-img" src="" class="detail-img">
            <h2 id="d-title" style="margin-bottom: 5px;"></h2>
            <h3 id="d-price" style="color: var(--accent-gold-bright); margin-bottom: 15px;"></h3>
            
            <div class="form-group">
                <label>Pilih Warna:</label>
                <select id="d-color" class="form-control">
                    <option value="Hitam">Hitam</option>
                    <option value="Putih">Putih</option>
                    <option value="Emas">Emas</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jumlah:</label>
                <input type="number" id="d-qty" class="form-control" value="1" min="1">
            </div>

            <button class="btn btn-gold" style="width: 100%; margin-top: 10px;" onclick="addToCart()">+ Masukkan Keranjang</button>

            <!-- Komentar / Review -->
            <div class="comments-section">
                <h4>Komentar Pembeli</h4>
                <div id="comments-list" style="margin-top: 10px;"></div>
                <div style="display: flex; gap: 5px; margin-top: 10px;">
                    <input type="text" id="input-comment" class="form-control" placeholder="Tulis komentar...">
                    <button class="btn btn-gold" onclick="addComment()">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL KERANJANG / CHECKOUT -->
    <div id="modal-cart" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('modal-cart')">&times;</button>
            <h2 style="margin-bottom: 15px;">Keranjang Saya</h2>
            
            <div id="cart-items">
                <!-- Item Keranjang dari JS -->
            </div>

            <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; text-align: left;">
                <h3>Total Pilih: <span id="cart-total" style="color: var(--accent-gold-bright);">Rp 0</span></h3>
                <button class="btn btn-gold" style="width: 100%; margin-top: 15px;" onclick="checkout()">Checkout Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('kingShopProducts')) || [
            { id: 1, nama: "Sepatu Sneaker Pro", kategori: "Sepatu", harga: 450000, stok: 10, gambar: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" },
            { id: 2, nama: "Tas BackPack Premium", kategori: "Tas", harga: 250000, stok: 5, gambar: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400" }
        ];

        let cart = JSON.parse(localStorage.getItem('kingShopCart')) || [];
        let comments = JSON.parse(localStorage.getItem('kingShopComments')) || {};
        let selectedProduct = null;

        function init() {
            localStorage.setItem('kingShopProducts', JSON.stringify(products));
            renderProducts();
            updateCartBadge();
        }

        function formatRupiah(num) {
            return "Rp " + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="product-card" onclick="openDetail(${p.id})">
                        <img src="${p.gambar}" alt="${p.nama}">
                        <div class="product-info">
                            <div class="product-title">${p.nama}</div>
                            <div class="product-price">${formatRupiah(p.harga)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function openDetail(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('d-img').src = selectedProduct.gambar;
            document.getElementById('d-title').innerText = selectedProduct.nama;
            document.getElementById('d-price').innerText = formatRupiah(selectedProduct.harga);
            document.getElementById('d-qty').value = 1;
            
            renderComments(id);
            document.getElementById('modal-detail').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function addToCart() {
            const color = document.getElementById('d-color').value;
            const qty = parseInt(document.getElementById('d-qty').value);

            const item = {
                id: Date.now(),
                productId: selectedProduct.id,
                nama: selectedProduct.nama,
                harga: selectedProduct.harga,
                gambar: selectedProduct.gambar,
                warna: color,
                qty: qty,
                checked: true
            };

            cart.push(item);
            saveCart();
            closeModal('modal-detail');
            alert('Berhasil masuk keranjang!');
        }

        function saveCart() {
            localStorage.setItem('kingShopCart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCart() {
            renderCart();
            document.getElementById('modal-cart').style.display = 'flex';
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary)">Keranjang Anda kosong.</p>';
                document.getElementById('cart-total').innerText = 'Rp 0';
                return;
            }

            cart.forEach((item, index) => {
                container.innerHTML += `
                    <div class="cart-item">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})">
                        <img src="${item.gambar}">
                        <div style="flex-grow:1;">
                            <div style="font-weight:bold;">${item.nama}</div>
                            <div style="font-size:0.8em; color:var(--text-secondary)">Warna: ${item.warna} | Qty: ${item.qty}</div>
                            <div style="color:var(--accent-gold-bright)">${formatRupiah(item.harga * item.qty)}</div>
                        </div>
                        <button onclick="removeItem(${index})" style="background:none; border:none; color:#ef4444; cursor:pointer;">✖</button>
                    </div>
                `;
            });
            calculateTotal();
        }

        function toggleCheck(index) {
            cart[index].checked = !cart[index].checked;
            saveCart();
            calculateTotal();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        function calculateTotal() {
            const total = cart.reduce((sum, item) => item.checked ? sum + (item.harga * item.qty) : sum, 0);
            document.getElementById('cart-total').innerText = formatRupiah(total);
        }

        function checkout() {
            const checkedItems = cart.filter(item => item.checked);
            if (checkedItems.length === 0) {
                alert("Pilih minimal satu barang untuk di-checkout!");
                return;
            }

            let orders = JSON.parse(localStorage.getItem('kingShopOrders')) || [];
            
            checkedItems.forEach(item => {
                orders.push({
                    id: "KS-" + Math.floor(1000 + Math.random() * 9000),
                    tanggal: new Date().toISOString().split('T')[0],
                    produk: `${item.nama} (${item.warna}) x${item.qty}`,
                    total: item.harga * item.qty
                });
            });

            localStorage.setItem('kingShopOrders', JSON.stringify(orders));

            // Sisa keranjang yang tidak dicekout
            cart = cart.filter(item => !item.checked);
            saveCart();

            closeModal('modal-cart');
            alert("Checkout Berhasil! Pesanan telah dikirim ke Admin.");
        }

        /* LOGIKA KOMENTAR */
        function renderComments(prodId) {
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            const prodComments = comments[prodId] || [];
            if(prodComments.length === 0) {
                list.innerHTML = '<span style="font-size:0.8em; color:var(--text-secondary)">Belum ada komentar.</span>';
            } else {
                prodComments.forEach(c => {
                    list.innerHTML += `<div class="comment-item"><strong>User:</strong> ${c}</div>`;
                });
            }
        }

        function addComment() {
            const input = document.getElementById('input-comment');
            if(!input.value.trim()) return;
            
            if(!comments[selectedProduct.id]) comments[selectedProduct.id] = [];
            comments[selectedProduct.id].push(input.value);
            
            localStorage.setItem('kingShopComments', JSON.stringify(comments));
            renderComments(selectedProduct.id);
            input.value = '';
        }

        init();
    </script>
</body>
</html>
